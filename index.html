     desktop and Android show a real Install option; iOS gets it via
     Share -> Add to Home Screen. -->

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20rx%3D%2236%22%20fill%3D%22%230B1017%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22140%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-weight%3D%22800%22%20font-size%3D%22118%22%20fill%3D%22%233ED8D0%22%20text-anchor%3D%22middle%22%3EM%3C%2Ftext%3E%3C%2Fsvg%3E%0A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20rx%3D%2236%22%20fill%3D%22%230B1017%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22140%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-weight%3D%22800%22%20font-size%3D%22118%22%20fill%3D%22%233ED8D0%22%20text-anchor%3D%22middle%22%3EM%3C%2Ftext%3E%3C%2Fsvg%3E%0A">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B1017; --bg2:#0E141D; --panel:#141C27; --panel2:#1B2531; --line:#26323F;
  --ink:#E6EDF5; --dim:#8A9AAC; --faint:#5A6878;
  --accent:#3ED8D0; --accent-dark:#0E5C58; --accent-ink:#05201F;
  --ok:#4ADE80; --warn:#FBBF24; --crit:#F87171; --cash:#7DD3A0;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}

/* ---------- tooltips + tutorial ----------
   An idle game is a game about numbers the player cannot see. The store
   row shows a price; it does not show what the thing earns, what you
   already own of it, or whether it beats the row above. The tooltip is
   where that lives, so buying is a decision rather than a guess. */
#tip{
  position:fixed;z-index:60;max-width:300px;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:8px;padding:11px 13px;box-shadow:0 14px 34px rgba(0,0,0,.55);
  opacity:0;transform:translateY(4px);transition:opacity .13s,transform .13s;
}
#tip.on{opacity:1;transform:none}
#tip .tip-n{font-weight:600;font-size:14px;margin-bottom:2px}
#tip .tip-f{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:8px}
#tip .tip-r{
  display:flex;justify-content:space-between;gap:14px;
  font-family:var(--mono);font-size:11.5px;padding:2.5px 0;
}
#tip .tip-r span{color:var(--dim)}
#tip .tip-r b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
#tip .tip-r b.good{color:var(--ok)}
#tip .tip-r b.warn{color:var(--warn)}
#tip .tip-note{
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.5;
}

/* The tour. One step at a time, anchored to the thing it is talking
   about, and it advances when the player actually does the thing --
   never on a timer alone, so nobody is hurried past a step. */
#coach{
  position:fixed;z-index:70;width:290px;
  background:var(--panel2);border:1px solid var(--accent-dark);
  border-radius:10px;padding:14px 15px;box-shadow:0 16px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
}
#coach.on{opacity:1;transform:none}
#coach .co-k{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;
}
#coach .co-h{font-size:15px;font-weight:600;margin-bottom:5px}
#coach .co-b{font-size:13px;line-height:1.55;color:var(--dim)}
#coach .co-f{display:flex;align-items:center;gap:10px;margin-top:12px}
#coach .co-skip{
  background:none;border:none;color:var(--faint);font-family:var(--sans);
  font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;
}
#coach .co-skip:hover{color:var(--dim)}
#coach .co-dots{display:flex;gap:5px;margin-left:auto}
#coach .co-dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
#coach .co-dot.on{background:var(--accent)}
/* The pointer is a rotated square tucked under the panel edge. */
#coach .co-arrow{
  position:absolute;width:10px;height:10px;background:var(--panel2);
  border-left:1px solid var(--accent-dark);border-top:1px solid var(--accent-dark);
}
/* Ring around whatever the current step is pointing at. */
.coach-target{
  position:relative;z-index:65;
  outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;
  animation:coachPulse 1.9s ease-in-out infinite;
}
@keyframes coachPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(62,216,208,.34)}
  50%    {box-shadow:0 0 0 8px rgba(62,216,208,0)}
}
@media (prefers-reduced-motion: reduce){
  .coach-target{animation:none}
  #tip,#coach{transition:none}
}
/* The per-row stat line. Redundant with the tooltip on a desktop, and the
   only place these numbers exist on a phone. */
.item-x{display:none;font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}
.item.locked .item-x{display:none!important}

@media (max-width:820px){
  /* top/bottom are set by placeCoach() itself on a phone -- see the JS.
     Anchoring by a fixed bottom offset, as this used to, let a step with
     more text than usual grow upward into the ticket it was supposed to
     be pointing near. The ring does the pointing on a phone; this panel
     just needs to stay out of the way. */
  #coach{width:auto;left:12px!important;right:12px;max-height:40vh;overflow-y:auto}
  #coach .co-arrow{display:none}
  #tip{display:none}      /* no hover on touch */
  .item-x{display:block}  /* so the row carries the numbers instead */
}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(62,216,208,.07),transparent);
}
/* Ambient datacenter floor. Cookie Clicker rises milk as you progress;
   here the room fills with racks as you hire, and the floor level climbs
   toward an exit. Purely decorative, so it is aria-hidden and sits behind
   everything. */
#floor{position:fixed;left:0;right:0;bottom:0;width:100%;height:38vh;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}

/* touch-action removes the double-tap-to-zoom gesture on every button --
   without it, tapping the ticket quickly reads as a double-tap on mobile
   Safari/Chrome and zooms the page instead of closing a ticket. Scoped
   to buttons rather than the whole page, so pinch-zoom elsewhere still
   works. */
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 384px;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
/* The rest of the phone layout lives at the end of this stylesheet, after
   the rules it needs to override. */

.main{display:flex;flex-direction:column;align-items:center;padding:22px 24px 40px;gap:20px}

.brand{display:flex;align-items:center;gap:10px;align-self:flex-start}
.brand-mark{
  width:30px;height:30px;border-radius:7px;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;
}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}

/* ---------- revenue ---------- */
.readout{text-align:center;margin-top:6px}
.cash{
  font-family:var(--mono);font-weight:700;font-size:clamp(34px,6vw,54px);
  color:var(--cash);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;
}
.rate{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.rate-note{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.rate-note.lead{color:var(--accent)}

/* ---------- the click target ---------- */
.ticket-wrap{position:relative;display:grid;place-items:center;padding:6px 0 2px}
/* Shaped like the thing it represents: a stub with the icon, a torn
   perforation, and the body of the ticket -- rather than a big square
   icon tile that needed a paragraph of hint text to explain itself. */
.ticket{
  width:min(340px,86vw);height:104px;border-radius:14px;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  display:flex;align-items:stretch;
  transition:transform .07s ease,box-shadow .2s ease,border-color .2s ease;
  box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;overflow:hidden;
}
.ticket::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 18% 50%,rgba(62,216,208,.16),transparent 62%);
  opacity:0;transition:opacity .2s;
}
.ticket:hover{border-color:var(--accent-dark);transform:translateY(-2px)}
.ticket:hover::after{opacity:1}
.ticket:active{transform:scale(.97) translateY(0)}

.ticket-stub{flex:0 0 78px;display:grid;place-items:center}
.ticket-icon{font-size:32px;line-height:1}
.ticket-divider{
  flex:0 0 0;align-self:stretch;margin:14px 0;
  border-left:2px dashed var(--line);
}
.ticket-main{
  flex:1;min-width:0;padding:0 20px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  text-align:left;
}
.ticket-label{font-weight:600;font-size:16px;letter-spacing:-.005em}
.ticket-worth{font-family:var(--mono);font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}

/* Present to screen readers, invisible on screen -- the tour and the
   tooltip both explain the controls now. */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* floating +$ */
.float{
  position:absolute;font-family:var(--mono);font-weight:700;font-size:17px;color:var(--cash);
  pointer-events:none;animation:rise 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6);
}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-64px)}}
@media(prefers-reduced-motion:reduce){
  .float{animation-duration:.01ms}
  .ticket,.ticket:hover,.ticket:active{transition:none;transform:none}
}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;width:min(520px,100%)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.stat-v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

/* ---------- prestige (lives in the store as the Exit tab) ---------- */
.prestige-card{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:12px;
}
.pc-h{font-weight:600;font-size:16px}
.pc-b{font-size:12.5px;color:var(--dim);line-height:1.55}
.pc-rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:8px;overflow:hidden}
.pc-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  background:var(--bg2);padding:9px 12px;font-size:12.5px;color:var(--dim);
}
.pc-row b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.pc-row b.pc-good{color:var(--warn)}
.pc-go{width:100%;text-align:center}
.pc-lock{
  font-family:var(--mono);font-size:11.5px;color:var(--faint);
  text-align:center;line-height:1.7;padding:9px;border:1px dashed var(--line);border-radius:8px;
}
.btn{
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;
  padding:9px 16px;border-radius:8px;white-space:nowrap;transition:filter .15s;
}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
.btn-warn{background:var(--warn);color:#3A2A05}

/* ---------- store ---------- */
.store{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
/* On a phone the store became a second screenful below the ticket, so the
   two halves of the game could never be seen together and hiring meant
   scrolling away from the thing you were clicking. It becomes a fixed
   bottom panel instead: click on top, shop underneath, both always up. */
@media(max-width:900px){
  .store{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    height:46vh;z-index:20;
    border-left:none;border-top:1px solid var(--line);
    box-shadow:0 -18px 44px rgba(0,0,0,.55);
  }
}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{
  flex:1;padding:13px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;transition:color .15s;
}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{
  display:inline-block;margin-left:5px;background:var(--accent);color:var(--accent-ink);
  border-radius:9px;padding:0 5px;font-size:9.5px;font-weight:700;
}
.list{overflow-y:auto;flex:1;padding:9px;display:flex;flex-direction:column;gap:7px}

.item{
  width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;display:grid;grid-template-columns:38px 1fr auto;
  gap:11px;align-items:center;transition:border-color .15s,background .15s;
}
.item:hover:not(:disabled){border-color:var(--accent-dark);background:var(--panel2)}
/* Only .72: at .42 an unaffordable row read as an empty panel, and a new
   player with $0 thought the Staff tab had nothing in it. */
.item:disabled{opacity:.72;cursor:not-allowed}
/* Locked tiers read as "not yet" rather than "broken". */
.item.locked{opacity:.45;border-style:dashed}
.item.locked .item-ic{background:transparent;font-size:15px}

/* Achievements are display-only rows, not purchases -- same shape as a
   store item so the tab doesn't feel like a different app, but no hover
   glow or affordability styling, since there's nothing to buy here. */
.item.ach{cursor:default}
.item.ach:hover{border-color:var(--line);background:var(--panel)}
.item.ach.got .item-ic{background:var(--accent-dark)}
.ach-got{color:var(--accent);font-size:16px;font-weight:700}

/* Owned count, drawn as pips -- one per hire, so a glance tells you the
   shape of your team without reading digits. */
.pips{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;align-items:center}
.pip{width:6px;height:9px;border-radius:1.5px;background:var(--accent);opacity:.85}
.pip.mgr{background:var(--warn)}
.pips .more{
  font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:3px;
  font-variant-numeric:tabular-nums;
}
.item-ic{
  width:38px;height:38px;border-radius:9px;background:var(--panel2);
  display:grid;place-items:center;font-size:19px;
}
.item-n{font-weight:600;font-size:14px;letter-spacing:-.005em}
.item-m{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.item-r{text-align:right}
.item-c{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--cash);font-variant-numeric:tabular-nums}
.item-c.cant{color:var(--crit)}
.item-o{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{padding:32px 18px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}

.toast-wrap{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:7px;z-index:50}
.toast{
  background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:10px 15px;font-size:13px;animation:slide .3s ease-out;max-width:300px;
}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.bar{display:flex;gap:7px;padding:9px;border-top:1px solid var(--line);flex-shrink:0}
.mini{
  flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:7px;border:1px solid var(--line);border-radius:7px;transition:color .15s,border-color .15s;
}
.mini:hover{color:var(--accent);border-color:var(--accent-dark)}

/* ---------- phone layout ----------
   Last in the file on purpose: these override .main, .ticket and .stats,
   and an earlier media query loses to a later plain rule no matter how
   specific it looks. Everything above the fixed store has to fit in what
   is left of the screen, so the click side gets tighter on every axis. */
@media(max-width:900px){
  .main{padding:12px 16px calc(46vh + 14px);gap:12px}
  .ticket{width:min(300px,88vw);height:78px;border-radius:12px}
  .ticket-stub{flex-basis:56px}
  .ticket-icon{font-size:24px}
  .ticket-main{padding:0 14px}
  .ticket-label{font-size:14px}
  .ticket-worth{font-size:12.5px}
  .cash{font-size:clamp(30px,10vw,44px)}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
  .stat{padding:7px 8px}
  .stat-k{font-size:8.5px;letter-spacing:.06em}
  .stat-v{font-size:13px;margin-top:1px}
  /* The room keeps the strip between the stats and the store. */
  #floor{height:30vh;bottom:46vh}
}
</style>
</head>
<body>

<canvas id="floor" aria-hidden="true"></canvas>

<div class="app">
  <main class="main">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-name">MSP Tycoon</div>
        <div class="brand-sub">Managed Service Provider</div>
      </div>
    </div>

    <div class="readout">
      <div class="cash" id="cash">$0</div>
      <!-- "from staff" matters: early on a click is worth ten seconds of
           your entire payroll, so an unqualified "/ sec" reads as a lie. -->
      <div class="rate"><span id="rate">$0.0</span> / sec from staff</div>
      <!-- Staff income alone reads as the whole game, but a click is worth
           far more early on. This says so plainly instead of leaving the
           player to work it out from two numbers that don't obviously
           relate. -->
      <div class="rate-note" id="rateNote"></div>
    </div>

    <div class="ticket-wrap" id="ticketWrap">
      <button class="ticket" id="ticket" aria-label="Close a support ticket">
        <span class="ticket-stub"><span class="ticket-icon">🎫</span></span>
        <span class="ticket-divider"></span>
        <span class="ticket-main">
          <span class="ticket-label">Close a Ticket</span>
          <span class="ticket-worth" id="clickWorth">+$1</span>
        </span>
        <!-- Visually hidden: the tour and the tooltip both explain how to
             play now, so this stopped earning its place on the button
             itself. Kept for screen readers. -->
        <span class="sr-only" id="ticketHint">click, or press space</span>
      </button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-k">Tickets</div><div class="stat-v" id="sTickets">0</div></div>
      <div class="stat"><div class="stat-k">Staff</div><div class="stat-v" id="sStaff">0</div></div>
      <div class="stat"><div class="stat-k">Lifetime</div><div class="stat-v" id="sLife">$0</div></div>
      <div class="stat"><div class="stat-k">Reputation</div><div class="stat-v" id="sRep" style="color:var(--warn)">0</div></div>
    </div>

  </main>

  <aside class="store">
    <div class="tabs">
      <button class="tab on" data-tab="staff">Staff</button>
      <button class="tab" data-tab="upgrades">Upgrades <span class="badge" id="upBadge" style="display:none">0</span></button>
      <button class="tab" data-tab="prestige">Exit <span class="badge" id="prBadge" style="display:none">!</span></button>
      <button class="tab" data-tab="awards">Awards <span class="badge" id="awBadge" style="display:none">0</span></button>
    </div>
    <div class="list" id="list"></div>
    <div class="bar">
      <button class="mini" id="saveBtn">Save</button>
      <button class="mini" id="wipeBtn">Wipe</button>
    </div>
  </aside>
</div>

<div class="toast-wrap" id="toasts"></div>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<div id="coach" role="dialog" aria-live="polite" aria-hidden="true"></div>

<script>
"use strict";

/* A script-killing error used to look like a game that merely felt
   broken: no floor, no income, staff appearing only after a tab switch.
   Nothing announced itself, so the cause had to be hunted. Surface it
   instead -- if the page throws, say so on the page. */
addEventListener("error", e => {
  const box = document.createElement("div");
  box.setAttribute("style",
    "position:fixed;left:0;right:0;bottom:0;z-index:999;padding:10px 14px;" +
    "background:#7F1D1D;color:#FEE2E2;font:12px/1.5 ui-monospace,monospace");
  box.textContent = "Something broke: " + (e.message || e.error) +
    " -- the game has stopped. Please report this.";
  (document.body || document.documentElement).appendChild(box);
});

/* ============================================================
   MSP Tycoon

   Deliberate architecture notes, since the previous build was undone
   by exactly these things:

   - ONE interval owns the simulation. Nothing else advances state.
   - State never round-trips through the DOM. The DOM is written to,
     never read from, as a source of truth.
   - STAFF and UPGRADES are static config and are never serialised.
     The save file carries only counts and flags, so the economy can be
     rebalanced and new content added without breaking existing saves.
   ============================================================ */

/* ---------- static config (never saved) ---------- */
const STAFF = [
  {id:"helpdesk", name:"Help Desk Tech",   icon:"🎧", cost:15,        rate:0.1,   blurb:"Password resets, mostly."},
  {id:"sysadmin", name:"Sysadmin",         icon:"🖥️", cost:100,       rate:1,     blurb:"Keeps the servers breathing."},
  {id:"neteng",   name:"Network Engineer", icon:"🌐", cost:1100,      rate:8,     blurb:"It's always DNS."},
  {id:"seceng",   name:"Security Analyst", icon:"🛡️", cost:12000,     rate:47,    blurb:"Catches things before they bill."},
  {id:"cloud",    name:"Cloud Architect",  icon:"☁️", cost:130000,    rate:260,   blurb:"Migrates it, then re-migrates it."},
  {id:"vcio",     name:"vCIO",             icon:"📊", cost:1400000,   rate:1400,  blurb:"Turns roadmaps into retainers."},
  {id:"noc",      name:"24/7 NOC",         icon:"🌙", cost:20000000,  rate:7800,  blurb:"Someone is always awake."},
  {id:"branch",   name:"Second Branch",    icon:"🏢", cost:330000000, rate:44000, blurb:"A whole other office."}
];

// kind: "staff" doubles one staff line; "click" doubles click value;
// "global" boosts everything; "hold" unlocks hold-to-work; "holdspeed"
// makes holding faster.
const UPGRADES = [
  {id:"macros",    name:"Ticket Macros",      icon:"⚡", cost:100,        kind:"click",  mult:2, need:()=>S.clicks>=25,           blurb:"Canned replies. Double click value."},
  {id:"queue",     name:"Queue Runner",       icon:"⏩", cost:400,        kind:"hold",           need:()=>S.clicks>=60,           blurb:"Hold to keep pulling tickets, one a second."},
  {id:"dispatch",  name:"Auto-Dispatcher",    icon:"🛰️", cost:15000,      kind:"holdspeed", mult:2, need:()=>!!S.upgrades.queue && S.clicks>=200, blurb:"Holding works twice as fast."},
  {id:"swarm",     name:"Swarm Triage",       icon:"🐝", cost:400000,     kind:"holdspeed", mult:2.5, need:()=>!!S.upgrades.dispatch,             blurb:"Holding works far faster again."},
  {id:"kb",        name:"Knowledge Base",     icon:"📚", cost:500,        kind:"staff",  target:"helpdesk", mult:2, need:()=>c("helpdesk")>=5,  blurb:"Help Desk output doubled."},
  {id:"rmm",       name:"RMM Agent",          icon:"🔧", cost:2500,       kind:"staff",  target:"sysadmin", mult:2, need:()=>c("sysadmin")>=5,  blurb:"Sysadmin output doubled."},
  {id:"scripts",   name:"Automation Scripts", icon:"📜", cost:5000,       kind:"click",  mult:2, need:()=>S.clicks>=100,          blurb:"Double click value again."},
  {id:"monitor",   name:"Monitoring Stack",   icon:"📡", cost:20000,      kind:"staff",  target:"neteng", mult:2, need:()=>c("neteng")>=5,      blurb:"Network Engineer output doubled."},
  {id:"psa",       name:"PSA Platform",       icon:"🗂️", cost:75000,      kind:"global", mult:1.25, need:()=>S.staffTotal>=25,    blurb:"All staff +25%."},
  {id:"siem",      name:"SIEM",               icon:"🔎", cost:250000,     kind:"staff",  target:"seceng", mult:2, need:()=>c("seceng")>=5,      blurb:"Security output doubled."},
  {id:"soc2",      name:"SOC 2 Report",       icon:"📋", cost:1200000,    kind:"global", mult:1.5,  need:()=>S.staffTotal>=50,    blurb:"Enterprise clients. All staff +50%."},
  {id:"iac",       name:"Infrastructure as Code", icon:"🧱", cost:6000000, kind:"staff", target:"cloud", mult:2, need:()=>c("cloud")>=5,      blurb:"Cloud output doubled."},
  {id:"ai",        name:"AI Triage",          icon:"🤖", cost:40000000,   kind:"global", mult:2, need:()=>S.staffTotal>=100,      blurb:"All staff doubled."}
];

/* Checked, not stored: an achievement is a pure function of state that is
   already saved (clicks, staffTotal, lifetime, upgrades, exits,
   reputation), so nothing here needs its own save format. Unlocking one
   just flips a flag in S.ach and stays flipped. */
const ACHIEVEMENTS = [
  {id:"first-ticket", name:"First Ticket",        icon:"🎫", desc:"Close your first ticket.",              check:()=>S.clicks>=1},
  {id:"century",      name:"Century",             icon:"💯", desc:"Close 100 tickets.",                    check:()=>S.clicks>=100},
  {id:"ticket-machine",name:"Ticket Machine",     icon:"🎟️", desc:"Close 1,000 tickets.",                  check:()=>S.clicks>=1000},
  {id:"first-hire",   name:"You're Not Alone",    icon:"🎧", desc:"Hire your first employee.",             check:()=>S.staffTotal>=1},
  {id:"full-roster",  name:"Full Roster",         icon:"🧑‍💼", desc:"Own at least one of every staff tier.", check:()=>STAFF.every(d=>c(d.id)>0)},
  {id:"small-army",   name:"Small Army",          icon:"👥", desc:"Reach 100 total staff.",                check:()=>S.staffTotal>=100},
  {id:"six-figures",  name:"Six Figures",         icon:"💵", desc:"Earn $100,000 lifetime revenue.",       check:()=>S.lifetime>=1e5},
  {id:"seven-figures",name:"Seven Figures",       icon:"💰", desc:"Earn $1,000,000 lifetime revenue.",     check:()=>S.lifetime>=1e6},
  {id:"eight-figures",name:"Enterprise Scale",    icon:"🏢", desc:"Earn $100,000,000 lifetime revenue.",   check:()=>S.lifetime>=1e8},
  {id:"tool-belt",    name:"Tool Belt",           icon:"🧰", desc:"Buy every upgrade.",                    check:()=>UPGRADES.every(u=>S.upgrades[u.id])},
  {id:"automated",    name:"Automate It",         icon:"⚙️", desc:"Unlock hold-to-work.",                  check:()=>!!S.upgrades.queue},
  {id:"first-exit",   name:"Sold",                icon:"🤝", desc:"Sell the company for the first time.",  check:()=>S.exits>=1},
  {id:"serial",       name:"Serial Entrepreneur", icon:"🔁", desc:"Sell the company 5 times.",             check:()=>S.exits>=5},
  {id:"reputable",    name:"Reputable",           icon:"⭐", desc:"Reach 50 reputation.",                  check:()=>S.reputation>=50},
  {id:"legend",       name:"Industry Legend",     icon:"🏆", desc:"Reach 200 reputation.",                 check:()=>S.reputation>=200},
];

function checkAchievements(){
  let unlocked = false;
  ACHIEVEMENTS.forEach(a=>{
    if(!S.ach[a.id] && a.check()){
      S.ach[a.id] = true;
      unlocked = true;
      toast("Achievement: " + a.name);
    }
  });
  if(unlocked){
    renderHead();
    if(tab === "awards") renderList(true);
  }
}

const SAVE_KEY = "mspTycoonSave";
const TICK_MS  = 100;               // one loop, 10Hz
const PRESTIGE_MIN = 1e6;           // lifetime revenue before an exit is allowed

/* ---------- mutable state (this, and only this, is saved) ---------- */
let S = {
  v: 1,
  cash: 0,
  lifetime: 0,
  clicks: 0,
  staff: {},                 // id -> count
  staffTotal: 0,
  upgrades: {},              // id -> true
  reputation: 0,             // permanent prestige currency
  exits: 0,                  // times the company has been sold
  ach: {},                   // id -> true, achievements unlocked
  lastSeen: Date.now(),
  tut: {}                    // tour progress: {step, done}
};

const c = id => S.staff[id] || 0;

/* ---------- number formatting ---------- */
const UNITS = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];

function scale(n){
  let t = 0;
  while(n >= 1000 && t < UNITS.length - 1){ n /= 1000; t++; }
  const dp = n < 10 ? 2 : n < 100 ? 1 : 0;
  // toFixed can round 999.99 up to "1000"; step the unit so the display
  // never reads "1000K" where "1.00M" is meant.
  if(+n.toFixed(dp) >= 1000 && t < UNITS.length - 1){ n /= 1000; t++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + UNITS[t];
}

// Counts (staff, tickets, reputation) are whole things and never fractional.
function fmt(n){
  if(!isFinite(n)) return "0";
  return n < 1000 ? Math.floor(n).toString() : scale(n);
}

// Money keeps cents until $1,000 so early clicks visibly move the number,
// then abbreviates once the digits stop being meaningful.
function money(n){
  if(!isFinite(n)) return "$0.00";
  if(n < 1000){
    return (+n.toFixed(2) >= 1000) ? "$" + scale(n) : "$" + n.toFixed(2);
  }
  return "$" + scale(n);
}

// Rates read better with one decimal in the low range.
function rateStr(n){
  if(!isFinite(n)) return "0";
  return n < 100 ? (Math.round(n * 10) / 10).toString() : scale(n);
}

/* ---------- derived economy (pure functions of state + config) ---------- */
function costOf(def){
  // Cookie Clicker's proven curve: each copy costs 15% more than the last.
  return Math.ceil(def.cost * Math.pow(1.15, c(def.id)));
}
function repMult(){ return 1 + S.reputation * 0.02; }   // +2% per reputation

function rateOf(def){
  let r = def.rate * c(def.id);
  if(!r) return 0;
  UPGRADES.forEach(u=>{
    if(!S.upgrades[u.id]) return;
    if(u.kind === "staff"  && u.target === def.id) r *= u.mult;
    if(u.kind === "global") r *= u.mult;
  });
  return r * repMult();
}
const totalRate = () => STAFF.reduce((s,d)=>s + rateOf(d), 0);

function clickValue(){
  let v = 1;
  UPGRADES.forEach(u=>{ if(S.upgrades[u.id] && u.kind === "click") v *= u.mult; });
  // Clicking stays relevant: it scales with a slice of passive income.
  // Floored to whole cents so a "double click value" upgrade reads as
  // exactly double ($2.00) instead of $2.005 rounding up to $2.01.
  return Math.floor((v + totalRate() * 0.05) * repMult() * 100) / 100;
}

function pendingRep(){
  if(S.lifetime < PRESTIGE_MIN) return 0;
  return Math.floor(Math.sqrt(S.lifetime / PRESTIGE_MIN)) - S.reputation;
}

/* ---------- rendering ---------- */
let tab = "staff";
const $ = id => document.getElementById(id);

function renderHead(){
  $("cash").textContent = money(S.cash);
  const tr = totalRate(), cv = clickValue();
  $("rate").textContent = "$" + rateStr(tr);
  $("clickWorth").textContent = "+" + money(cv);

  // Tell the player outright which of the two numbers is currently doing
  // the work, rather than leaving it to be inferred from a $0.1/s label
  // sitting next to a $1.00 click.
  const note = $("rateNote");
  if(note){
    if(tr <= 0){
      note.textContent = "Clicking is your only income until you hire.";
      note.classList.add("lead");
    } else if(cv > tr){
      note.textContent = "Each click still beats " + Math.ceil(cv / tr) + "s of payroll — keep clicking.";
      note.classList.add("lead");
    } else {
      note.textContent = "Payroll has overtaken clicking.";
      note.classList.remove("lead");
    }
  }
  const hint = $("ticketHint");
  if(hint){
    hint.textContent = canHold()
      ? "click, or hold — " + rateStr(1000 / holdInterval()) + "/sec"
      : "click, or press space";
  }
  $("sTickets").textContent = fmt(S.clicks);
  $("sStaff").textContent = fmt(S.staffTotal);
  $("sLife").textContent = money(S.lifetime);
  $("sRep").textContent = fmt(S.reputation);

  // The Exit tab flags itself when an exit is actually available.
  const prBadge = $("prBadge");
  prBadge.style.display = pendingRep() > 0 ? "inline-block" : "none";

  const avail = UPGRADES.filter(u=>!S.upgrades[u.id] && u.need() && S.cash >= u.cost).length;
  const badge = $("upBadge");
  badge.style.display = avail ? "inline-block" : "none";
  badge.textContent = avail;

  const awBadge = $("awBadge");
  if(awBadge){
    const unlocked = Object.keys(S.ach).length;
    awBadge.style.display = unlocked ? "inline-block" : "none";
    awBadge.textContent = unlocked + "/" + ACHIEVEMENTS.length;
  }
}

/* One pip per hire, capped so a hundred staff cannot blow out the row --
   past the cap the remainder is shown as a count instead. */
const PIP_CAP = 20;
function pipsFor(n){
  if(!n) return "";
  const shown = Math.min(n, PIP_CAP);
  let html = "";
  for(let i = 0; i < shown; i++) html += '<span class="pip"></span>';
  if(n > PIP_CAP) html += '<span class="more">+' + fmt(n - PIP_CAP) + '</span>';
  return html;
}

/* The store is rebuilt only when the *set* of visible rows changes.
   Affordability changes every tick, so that is applied separately by
   refreshAffordability() -- rebuilding this DOM ten times a second would
   flicker and steal clicks mid-press. */
let listSig = "";

function listSignature(){
  if(tab === "staff"){
    // Includes lock state, so unlocking a tier rebuilds the row rather
    // than leaving a stale padlock in place.
    return "s|" + STAFF.map((d,i)=>{
      const unlocked = i === 0 || c(STAFF[i-1].id) > 0;
      return d.id + ":" + c(d.id) + ":" + (unlocked ? 1 : 0);
    }).join(",");
  }
  if(tab === "prestige"){
    // Rebuild as the headline numbers move, but not every tick.
    return "p|" + pendingRep() + "|" + S.reputation + "|" + Math.floor(S.lifetime / 1000);
  }
  if(tab === "awards"){
    return "a|" + Object.keys(S.ach).length;
  }
  return "u|" + UPGRADES.filter(u=>!S.upgrades[u.id] && u.need()).map(u=>u.id).join(",");
}

function refreshAffordability(){
  document.querySelectorAll("#list .item").forEach(el=>{
    const kind = el.dataset.kind, id = el.dataset.id;
    let cost;
    if(kind === "staff"){
      const d = STAFF.find(x=>x.id===id); if(!d) return;
      cost = costOf(d);
      const rateEl = el.querySelector(".js-rate");
      if(rateEl) rateEl.textContent = c(d.id) ? "$" + rateStr(rateOf(d)) + "/s · " : "";
      const ownEl = el.querySelector(".item-o");
      if(ownEl) ownEl.textContent = c(d.id);
      // Pips are cheap to diff by count, and rebuilding the row on every
      // hire would fight the signature cache.
      const pipEl = el.querySelector(".js-pips");
      if(pipEl && +pipEl.dataset.n !== c(d.id)){
        pipEl.dataset.n = c(d.id);
        pipEl.innerHTML = pipsFor(c(d.id));
      }
    } else {
      const u = UPGRADES.find(x=>x.id===id); if(!u) return;
      cost = u.cost;
    }
    // A locked row must stay disabled however much cash is on hand;
    // affordability alone is not permission to buy.
    const locked = el.classList.contains("locked");
    const afford = S.cash >= cost;
    el.disabled = locked || !afford;
    const costEl = el.querySelector(".item-c");
    if(costEl){
      costEl.textContent = money(cost);
      costEl.classList.toggle("cant", locked || !afford);
    }
  });
}

function renderList(force){
  const sig = listSignature();
  if(!force && sig === listSig){ refreshAffordability(); return; }
  listSig = sig;

  const list = $("list");
  list.innerHTML = "";

  if(tab === "staff"){
    // Every tier is listed. Ones you have not unlocked yet are shown
    // locked, with the reason -- hiding them entirely meant a player
    // holding $122 could see no way to spend it and no hint why.
    STAFF.forEach((d,i)=>{
      const unlocked = i === 0 || c(STAFF[i-1].id) > 0;
      const cost = costOf(d);
      const afford = S.cash >= cost;
      const b = document.createElement("button");
      b.className = "item" + (unlocked ? "" : " locked");
      b.dataset.kind = "staff";
      b.dataset.id = d.id;
      b.disabled = !unlocked || !afford;

      if(unlocked){
        // There is no hover on a phone, so the numbers the tooltip carries
        // have to live in the row itself at that size.
        const each = d.rate * repMult();
        const back = each > 0 ? Math.ceil(cost / each) : 0;
        b.innerHTML =
          '<div class="item-ic">' + d.icon + '</div>' +
          '<div><div class="item-n">' + d.name + '</div>' +
          '<div class="item-m"><span class="js-rate">' + (c(d.id) ? "$" + rateStr(rateOf(d)) + "/s · " : "") + '</span>' + d.blurb + '</div>' +
          '<div class="item-x">$' + rateStr(each) + '/s each · pays for itself in ' + back + 's</div>' +
          '<div class="pips js-pips">' + pipsFor(c(d.id)) + '</div></div>' +
          '<div class="item-r"><div class="item-c' + (afford ? "" : " cant") + '">' + money(cost) + '</div>' +
          '<div class="item-o">' + c(d.id) + '</div></div>';
        b.onclick = () => buyStaff(d);
      } else {
        b.innerHTML =
          '<div class="item-ic">🔒</div>' +
          '<div><div class="item-n">' + d.name + '</div>' +
          '<div class="item-m">Hire a ' + STAFF[i-1].name + ' to unlock</div></div>' +
          '<div class="item-r"><div class="item-c cant">' + money(cost) + '</div></div>';
      }
      list.appendChild(b);
    });
  } else if(tab === "prestige"){
    const p = pendingRep();
    const box = document.createElement("div");
    box.className = "prestige-card";
    box.innerHTML =
      '<div class="pc-h">Sell the company</div>' +
      '<div class="pc-b">Walk away, bank the reputation, and start the next one with everything you learned. ' +
      'Cash, staff and upgrades reset. Reputation is permanent and applies to every future run.</div>' +
      '<div class="pc-rows">' +
        '<div class="pc-row"><span>Reputation held</span><b>' + fmt(S.reputation) + '</b></div>' +
        '<div class="pc-row"><span>Current bonus</span><b>+' + (S.reputation*2) + '%</b></div>' +
        '<div class="pc-row"><span>Lifetime revenue</span><b>' + money(S.lifetime) + '</b></div>' +
        '<div class="pc-row"><span>Exit is worth</span><b class="' + (p>0?"pc-good":"") + '">' + fmt(p) + ' rep</b></div>' +
      '</div>' +
      (p > 0
        ? '<button class="btn btn-warn pc-go" id="prestigeBtn">Sell for ' + fmt(p) + ' reputation</button>'
        : '<div class="pc-lock">Reach ' + money(PRESTIGE_MIN) + ' lifetime revenue to make an exit worthwhile.<br>' +
          money(Math.max(0, PRESTIGE_MIN - S.lifetime)) + ' to go.</div>');
    list.appendChild(box);
    const go = $("prestigeBtn");
    if(go) go.onclick = prestige;
    return;
  } else if(tab === "awards"){
    // Shown unlocked or locked, never hidden -- a locked row with its
    // condition still visible is a goal, not a spoiler, and matches how
    // the staff tab already treats what you haven't reached yet.
    ACHIEVEMENTS.forEach(a=>{
      const got = !!S.ach[a.id];
      const b = document.createElement("div");
      b.className = "item ach" + (got ? " got" : " locked");
      b.innerHTML =
        '<div class="item-ic">' + (got ? a.icon : "🔒") + '</div>' +
        '<div><div class="item-n">' + a.name + '</div>' +
        '<div class="item-m">' + a.desc + '</div></div>' +
        (got ? '<div class="item-r"><div class="item-c ach-got">&#10003;</div></div>' : '');
      list.appendChild(b);
    });
    return;
  } else {
    const show = UPGRADES.filter(u=>!S.upgrades[u.id] && u.need());
    if(!show.length){
      list.innerHTML = '<div class="empty">No upgrades available yet.<br>Hire more staff and close more tickets.</div>';
      return;
    }
    show.forEach(u=>{
      const afford = S.cash >= u.cost;
      const b = document.createElement("button");
      b.className = "item";
      b.dataset.kind = "upgrade";
      b.dataset.id = u.id;
      b.disabled = !afford;
      b.innerHTML =
        '<div class="item-ic">' + u.icon + '</div>' +
        '<div><div class="item-n">' + u.name + '</div><div class="item-m">' + u.blurb + '</div></div>' +
        '<div class="item-r"><div class="item-c' + (afford ? "" : " cant") + '">' + money(u.cost) + '</div></div>';
      b.onclick = () => buyUpgrade(u);
      list.appendChild(b);
    });
  }
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ---------- actions ---------- */
function earn(n){ S.cash += n; S.lifetime += n; }

function closeTicket(x, y){
  const v = clickValue();
  earn(v);
  S.clicks++;
  if(x !== undefined){
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = "+" + money(v);
    f.style.left = x + "px";
    f.style.top  = y + "px";
    $("ticketWrap").appendChild(f);
    setTimeout(()=>f.remove(), 1000);
  }
  renderHead();
}

function buyStaff(d){
  const cost = costOf(d);
  if(S.cash < cost) return;
  S.cash -= cost;
  S.staff[d.id] = c(d.id) + 1;
  S.staffTotal++;
  if(S.staff[d.id] === 1) toast("Hired your first " + d.name + ".");
  renderHead(); renderList(); checkAchievements();
}

function buyUpgrade(u){
  if(S.cash < u.cost || S.upgrades[u.id]) return;
  S.cash -= u.cost;
  S.upgrades[u.id] = true;
  // A speed change while the button is already down should apply now, not
  // after the player lets go. The interval has to be rebuilt to re-read it.
  if((u.kind === "hold" || u.kind === "holdspeed") && holdTimer && lastHoldPos){
    stopHold();
    startHold(lastHoldPos);
  }
  toast(u.name + " acquired.");
  renderHead(); renderList(); checkAchievements();
}

function prestige(){
  const p = pendingRep();
  if(p <= 0) return;
  if(!confirm("Sell the company for " + fmt(p) + " reputation?\n\nCash, staff and upgrades reset. Reputation is permanent.")) return;
  S.reputation += p;
  S.exits += 1;
  S.cash = 0; S.staff = {}; S.staffTotal = 0; S.upgrades = {};
  // lifetime deliberately persists: it is the record of everything ever built.
  toast("Acquired. +" + fmt(p) + " reputation.");
  renderHead(); renderList(); checkAchievements(); save();
}

/* ---------- persistence (mutable state only) ---------- */
function save(){
  S.lastSeen = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch(e){ console.error("save failed", e); }
}

function load(){
  let raw;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){ return; }
  if(!raw) return;
  let d;
  try{ d = JSON.parse(raw); }catch(e){ console.error("corrupt save, ignoring"); return; }
  if(!d || typeof d !== "object") return;

  // Merge field by field. Never assign the object wholesale -- that is how a
  // save from an older version silently deletes fields added since.
  S.cash       = +d.cash       || 0;
  S.lifetime   = +d.lifetime   || 0;
  S.clicks     = +d.clicks     || 0;
  S.reputation = +d.reputation || 0;
  S.exits      = +d.exits      || 0;
  S.staff      = (d.staff && typeof d.staff === "object") ? d.staff : {};
  S.upgrades   = (d.upgrades && typeof d.upgrades === "object") ? d.upgrades : {};
  S.ach        = (d.ach && typeof d.ach === "object") ? d.ach : {};
  S.lastSeen   = +d.lastSeen || Date.now();
  // Absent on saves from before the tour existed. Those players have
  // already learned the game, so treat a missing record as "seen it".
  S.tut        = (d.tut && typeof d.tut === "object") ? d.tut : {done:true};

  // Drop ids that no longer exist, so removing content cannot corrupt a save.
  Object.keys(S.staff).forEach(k=>{ if(!STAFF.some(s=>s.id===k)) delete S.staff[k]; });
  Object.keys(S.upgrades).forEach(k=>{ if(!UPGRADES.some(u=>u.id===k)) delete S.upgrades[k]; });
  Object.keys(S.ach).forEach(k=>{ if(!ACHIEVEMENTS.some(a=>a.id===k)) delete S.ach[k]; });

  S.staffTotal = STAFF.reduce((n,d2)=>n + c(d2.id), 0);

  // Offline earnings, capped at 8h so leaving it a month isn't a free win.
  const away = Math.min((Date.now() - S.lastSeen) / 1000, 8*3600);
  if(away > 60){
    const gained = totalRate() * away;
    if(gained > 0){
      earn(gained);
      setTimeout(()=>toast("While you were out: " + money(gained)), 500);
    }
  }
}

/* ---------- wiring ---------- */
/* Click, or hold. Holding runs on our own interval rather than relying on
   the OS key-repeat rate, which is slow, differs per machine, and does not
   exist at all for a held mouse button. */
// Holding is earned, not free: it arrives with Queue Runner and speeds up
// with later upgrades. Base cadence is one ticket a second -- deliberately
// slower than a person can click, so holding is the lazy option rather than
// the optimal one.
const HOLD_BASE_MS = 1000;
let holdTimer = null;

const canHold = () => !!S.upgrades.queue;
function holdInterval(){
  let ms = HOLD_BASE_MS;
  UPGRADES.forEach(u=>{ if(S.upgrades[u.id] && u.kind === "holdspeed") ms /= u.mult; });
  return Math.max(60, ms);
}

function ticketCentre(){
  const r = $("ticket").getBoundingClientRect(), w = $("ticketWrap").getBoundingClientRect();
  return [r.left - w.left + r.width/2, r.top - w.top + r.height/2];
}
let lastHoldPos = null;
function startHold(getPos){
  if(holdTimer || !canHold()) return;
  lastHoldPos = getPos;
  holdTimer = setInterval(()=>{ const p = getPos(); closeTicket(p[0], p[1]); }, holdInterval());
}
function stopHold(){
  if(holdTimer){ clearInterval(holdTimer); holdTimer = null; }
}

const ticketEl = $("ticket");

ticketEl.addEventListener("pointerdown", e=>{
  if(e.button !== 0) return;
  const r = $("ticketWrap").getBoundingClientRect();
  let pos = [e.clientX - r.left, e.clientY - r.top];
  closeTicket(pos[0], pos[1]);                       // immediate feedback
  ticketEl.addEventListener("pointermove", track);
  startHold(()=>pos);
  function track(ev){ pos = [ev.clientX - r.left, ev.clientY - r.top]; }
  const end = ()=>{
    stopHold();
    ticketEl.removeEventListener("pointermove", track);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
  };
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
});

// Space: fire once on press, then repeat while held. e.repeat is ignored
// because our own interval drives the cadence.
document.addEventListener("keydown", e=>{
  if(e.code !== "Space") return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  e.preventDefault();
  if(e.repeat) return;
  closeTicket.apply(null, ticketCentre());
  ticketEl.classList.add("held");
  startHold(ticketCentre);
});
document.addEventListener("keyup", e=>{
  if(e.code !== "Space") return;
  stopHold();
  ticketEl.classList.remove("held");
});
// Losing focus mid-hold would otherwise leave the interval running forever.
window.addEventListener("blur", ()=>{ stopHold(); ticketEl.classList.remove("held"); });

// touch-action: manipulation (in the stylesheet) is supposed to remove
// double-tap-to-zoom on its own, but several mobile browsers only honor
// that inconsistently -- rapid tapping on the ticket is exactly the
// gesture that trips it. This is the standard, more reliable backstop:
// eat the second touchend of a fast double-tap so it never reaches the
// browser's zoom gesture. Scoped to the document since the same double
// tap can land on a store row or a tab just as easily as the ticket.
let lastTouchEnd = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - lastTouchEnd <= 350) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    tab = t.dataset.tab;
    renderList(true);   // force: the signature scheme is per-tab
    hideTip();          // the row it described no longer exists
    coachSync();        // a step may be anchored to a row on this tab
  };
});

// No prestige button is wired here on purpose. It only exists while the
// Prestige tab is open, so renderList() creates it and binds it there.
// Binding it at startup threw on null and killed every line below this
// one -- the floor, the game loop, and the first renderList() -- which
// is why staff only appeared after a tab switch: those handlers are
// bound above, so they survived.
$("saveBtn").onclick = ()=>{ save(); toast("Saved."); };
$("wipeBtn").onclick = ()=>{
  if(!confirm("Erase everything, including reputation?")) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  // tut resets too: a wipe is someone starting over, and the tour is part
  // of starting.
  S = {v:1,cash:0,lifetime:0,clicks:0,staff:{},staffTotal:0,upgrades:{},reputation:0,exits:0,ach:{},lastSeen:Date.now(),tut:{}};
  renderHead(); renderList(); coachSync(); toast("Wiped.");
};
window.addEventListener("beforeunload", save);

/* ---------- ambient datacenter floor ----------
   One rack per two staff, up to a roomful. The floor line rises with
   progress toward the next exit, so the room visibly fills as a run
   matures. Drawn on canvas rather than as DOM so it costs nothing to
   animate and never interferes with clicking. */
const floorCv = $("floor");
const fx = floorCv.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let racks = [];

function sizeFloor(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  floorCv.width  = Math.floor(innerWidth * dpr);
  floorCv.height = Math.floor(floorCv.clientHeight * dpr);
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildRacks();
}

function buildRacks(){
  // Always show a few racks: you rent the room before you fill it, and a
  // brand-new player was previously getting an empty canvas -- floor(0/2)
  // is zero, so nothing was drawn at all.
  // Start with a visible room. Three racks at low alpha read as an empty
  // page, which is how a working background got reported as no background
  // at all. The room should look like somewhere before you have filled it.
  const want = Math.min(7 + Math.floor(S.staffTotal / 2), 30);
  const w = innerWidth;
  racks = [];
  for(let i = 0; i < want; i++){
    // Deterministic per index, so racks don't jump around between rebuilds.
    const seed = Math.sin(i * 12.9898) * 43758.5453;
    const r = seed - Math.floor(seed);
    racks.push({
      x: (i / Math.max(want, 1)) * w + (r - 0.5) * 26,
      h: 54 + r * 66,
      w: 24 + r * 12,
      depth: r,                      // 0 = far, 1 = near
      leds: 3 + Math.floor(r * 4),
      phase: r * 10
    });
  }
  racks.sort((a,b)=>a.depth - b.depth);   // far racks drawn first
}

function drawFloor(t){
  const W = innerWidth, H = floorCv.clientHeight;
  fx.clearRect(0, 0, W, H);

  // Progress toward the next exit raises the floor line.
  const prog = Math.min(S.lifetime / PRESTIGE_MIN, 1);
  const baseY = H - 10 - prog * (H * 0.22);

  // Haze so racks fade into the page rather than sitting on a hard edge.
  const g = fx.createLinearGradient(0, baseY - 170, 0, H);
  g.addColorStop(0, "rgba(62,216,208,0)");
  g.addColorStop(1, "rgba(62,216,208," + (0.12 + prog * 0.10).toFixed(3) + ")");
  fx.fillStyle = g;
  fx.fillRect(0, baseY - 170, W, H - baseY + 170);

  // The room itself: a receding floor grid, so there is something to look
  // at from the very first second rather than only once staff exist.
  fx.strokeStyle = "rgba(62,216,208,0.20)";
  fx.lineWidth = 1;
  fx.beginPath();
  for(let i = 0; i <= 7; i++){
    const y = baseY + Math.pow(i / 7, 1.9) * (H - baseY);
    fx.moveTo(0, y); fx.lineTo(W, y);
  }
  const vanish = W / 2;
  for(let i = -8; i <= 8; i++){
    fx.moveTo(vanish + i * (W / 9), H);
    fx.lineTo(vanish + i * (W / 42), baseY);
  }
  fx.stroke();

  // The horizon, and a glow sitting on it, so the room has a far wall
  // rather than fading into flat background.
  const hz = fx.createLinearGradient(0, baseY - 60, 0, baseY);
  hz.addColorStop(0, "rgba(62,216,208,0)");
  hz.addColorStop(1, "rgba(62,216,208," + (0.10 + prog * 0.09).toFixed(3) + ")");
  fx.fillStyle = hz;
  fx.fillRect(0, baseY - 60, W, 60);
  fx.strokeStyle = "rgba(62,216,208,0.45)";
  fx.beginPath(); fx.moveTo(0, baseY); fx.lineTo(W, baseY); fx.stroke();

  racks.forEach((r, i) => {
    const near = 0.45 + r.depth * 0.55;
    const y = baseY - r.h * near;
    // Racks are lit cabinets in a dark room, not shadows on a dark page:
    // they need to clear the background, and the near ones most of all.
    fx.globalAlpha = 0.42 + r.depth * 0.40;
    fx.fillStyle = "#161F2B";
    fx.fillRect(r.x, y, r.w * near, r.h * near);
    fx.globalAlpha = 0.55 + r.depth * 0.40;
    fx.strokeStyle = "#3A4A5C";
    fx.lineWidth = 1;
    fx.strokeRect(r.x + .5, y + .5, r.w * near, r.h * near);
    // A cool wash down the face, so a rack is not a flat rectangle.
    const face = fx.createLinearGradient(0, y, 0, y + r.h * near);
    face.addColorStop(0, "rgba(62,216,208,0.13)");
    face.addColorStop(1, "rgba(62,216,208,0)");
    fx.fillStyle = face;
    fx.fillRect(r.x, y, r.w * near, r.h * near);

    // Activity LEDs. Static when reduced motion is requested.
    for(let l = 0; l < r.leds; l++){
      const ly = y + 8 + l * ((r.h * near - 12) / r.leds);
      const blink = reduceMotion ? 0.7 : (Math.sin(t / 420 + r.phase + l * 1.7) + 1) / 2;
      fx.globalAlpha = (0.55 + r.depth * 0.45) * (0.4 + blink * 0.6);
      fx.fillStyle = l % 4 === 0 ? "#FBBF24" : "#3ED8D0";
      fx.fillRect(r.x + 4, ly, 4, 2);
    }
  });
  fx.globalAlpha = 1;
}

let floorRaf = null, lastRackCount = -1;
function floorTick(t){
  if(S.staffTotal !== lastRackCount){ lastRackCount = S.staffTotal; buildRacks(); }
  drawFloor(t);
  floorRaf = requestAnimationFrame(floorTick);
}
addEventListener("resize", sizeFloor);
sizeFloor();
floorRaf = requestAnimationFrame(floorTick);

/* ---------- tooltips ----------
   Built on demand from live state, because the interesting numbers are
   all relative: what this tier earns *now*, what share of income it is,
   and whether the next one is better value than the one above it. */
const tipEl = $("tip");
let tipFor = null;

function pctOfIncome(r){
  const t = totalRate();
  return t > 0 ? Math.round((r / t) * 100) : 0;
}

function staffTip(d, i, unlocked){
  const own = c(d.id), cost = costOf(d), each = d.rate * repMult();
  const mine = rateOf(d);
  if(!unlocked){
    return '<div class="tip-n">' + d.name + '</div>' +
      '<div class="tip-f">locked</div>' +
      '<div class="tip-r"><span>Unlocks when</span><b>1 ' + STAFF[i-1].name + '</b></div>' +
      '<div class="tip-r"><span>Would cost</span><b>' + money(cost) + '</b></div>' +
      '<div class="tip-r"><span>Would earn</span><b>$' + rateStr(each) + '/s each</b></div>' +
      '<div class="tip-note">Every tier is worth more per hire than the one above it, but costs more. Hire the cheapest thing you can afford and you will rarely be far wrong.</div>';
  }
  // What the next one buys you, in seconds-to-repay. This is the number
  // that actually decides a purchase, and no store row shows it.
  const payback = each > 0 ? cost / each : Infinity;
  return '<div class="tip-n">' + d.name + '</div>' +
    '<div class="tip-f">' + d.blurb + '</div>' +
    '<div class="tip-r"><span>You own</span><b>' + fmt(own) + '</b></div>' +
    '<div class="tip-r"><span>Each earns</span><b>$' + rateStr(each) + '/s</b></div>' +
    (own > 0
      ? '<div class="tip-r"><span>These earn</span><b class="good">$' + rateStr(mine) + '/s</b></div>' +
        '<div class="tip-r"><span>Share of payroll</span><b>' + pctOfIncome(mine) + '%</b></div>'
      : '') +
    '<div class="tip-r"><span>Next one costs</span><b class="' + (S.cash >= cost ? "good" : "warn") + '">' + money(cost) + '</b></div>' +
    '<div class="tip-r"><span>Pays for itself in</span><b>' + (isFinite(payback) ? Math.ceil(payback) + "s" : "--") + '</b></div>' +
    (S.reputation > 0 ? '<div class="tip-note">Includes your +' + (S.reputation*2) + '% reputation bonus.</div>' : '');
}

function upgradeTip(u){
  let effect;
  if(u.kind === "click")     effect = "Click value x" + u.mult;
  else if(u.kind === "global")   effect = "All staff output x" + u.mult;
  else if(u.kind === "holdspeed") effect = "Hold speed x" + u.mult;
  else if(u.kind === "staff"){
    const t = STAFF.find(s=>s.id===u.target);
    effect = (t ? t.name : u.target) + " output x" + u.mult;
  } else effect = "Unlocks holding to close tickets";

  // Show what it does to the number the player is watching right now.
  let delta = "";
  if(u.kind === "click"){
    delta = money(clickValue()) + " -> " + money(clickValue() * u.mult) + " per click";
  } else if(u.kind === "global"){
    delta = "$" + rateStr(totalRate()) + "/s -> $" + rateStr(totalRate() * u.mult) + "/s";
  } else if(u.kind === "staff"){
    const t = STAFF.find(s=>s.id===u.target);
    if(t && c(t.id) > 0) delta = "$" + rateStr(rateOf(t)) + "/s -> $" + rateStr(rateOf(t) * u.mult) + "/s from them";
  }

  return '<div class="tip-n">' + u.name + '</div>' +
    '<div class="tip-f">one-off purchase, permanent</div>' +
    '<div class="tip-r"><span>Effect</span><b>' + effect + '</b></div>' +
    (delta ? '<div class="tip-r"><span>For you</span><b class="good">' + delta + '</b></div>' : '') +
    '<div class="tip-r"><span>Cost</span><b class="' + (S.cash >= u.cost ? "good" : "warn") + '">' + money(u.cost) + '</b></div>' +
    '<div class="tip-note">' + u.blurb + '</div>';
}

function placeTip(el){
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  // Prefer the left of the store panel; flip inside the viewport if it
  // will not fit, and never let it run off the bottom.
  let x = r.left - t.width - 12;
  if(x < 8) x = Math.min(r.right + 12, innerWidth - t.width - 8);
  let y = r.top + r.height/2 - t.height/2;
  y = Math.max(8, Math.min(y, innerHeight - t.height - 8));
  tipEl.style.left = Math.round(x) + "px";
  tipEl.style.top  = Math.round(y) + "px";
}

function showTip(el){
  const kind = el.dataset.kind, id = el.dataset.id;
  let html;
  if(kind === "staff"){
    const i = STAFF.findIndex(x=>x.id===id); if(i < 0) return;
    html = staffTip(STAFF[i], i, !el.classList.contains("locked"));
  } else {
    const u = UPGRADES.find(x=>x.id===id); if(!u) return;
    html = upgradeTip(u);
  }
  tipEl.innerHTML = html;
  tipEl.classList.add("on");
  tipEl.setAttribute("aria-hidden","false");
  tipFor = el;
  placeTip(el);
}
function hideTip(){
  tipEl.classList.remove("on");
  tipEl.setAttribute("aria-hidden","true");
  tipFor = null;
}
// Delegated, so it keeps working across every list rebuild.
$("list").addEventListener("mouseover", e=>{
  const el = e.target.closest(".item"); if(!el || el === tipFor) return;
  showTip(el);
});
$("list").addEventListener("mouseout", e=>{
  const el = e.target.closest(".item");
  if(el && !el.contains(e.relatedTarget)) hideTip();
});
$("list").addEventListener("focusin",  e=>{ const el = e.target.closest(".item"); if(el) showTip(el); });
$("list").addEventListener("focusout", hideTip);
$("list").addEventListener("scroll", hideTip, {passive:true});

/* ---------- the tour ----------
   Five steps, each anchored to the thing it describes. A step clears
   when the player does it, not when a timer runs out -- so the tour is
   a set of prompts rather than a slideshow you sit through. */
const plural = (n, one) => n + " " + one + (n === 1 ? "" : "s");

const TOUR = [
  {
    k:"step 1", h:"Close some tickets",
    b:()=>"Click the ticket, or press space. Right now clicking is the fast way to earn — a closed ticket beats what any amount of staff pays out this early.<br><br><b>" +
        plural(Math.max(0, 5 - S.clicks), "more ticket") + "</b> to go.",
    at:()=>$("ticket"), side:"right",
    done:()=>S.clicks >= 5
  },
  {
    k:"step 2", h:"Hire your first tech",
    b:()=>"A Help Desk Tech costs " + money(costOf(STAFF[0])) + ". They earn less per second than a click, but they earn it while you're not clicking — even with the tab closed. Keep clicking; hire when you can.<br><br><b>" +
        (S.cash >= costOf(STAFF[0]) ? "You can afford one now — hire them." : "Keep clicking: " + money(costOf(STAFF[0]) - S.cash) + " to go.") + "</b>",
    at:()=>document.querySelector('#list .item[data-kind="staff"]'), side:"left",
    show:()=>tab === "staff",
    done:()=>S.staffTotal >= 1
  },
  {
    k:"step 3", h:"Payroll catches up eventually",
    b:()=>{
      const n = Math.max(0, 3 - S.staffTotal);
      return "That's what your staff earn every second on their own. Right now clicking still earns more — the note under it says by how much. Keep hiring and that flips: payroll takes over, and clicking becomes the bonus.<br><br>" +
        "Hover any row to see what it would add. <b>Hire " +
        (n === 1 ? "1 more person" : n + " more people") + "</b> to carry on.";
    },
    at:()=>$("rate"), side:"right",
    done:()=>S.staffTotal >= 3
  },
  {
    k:"step 4", h:"Upgrades multiply",
    b:"Staff add to your income. Upgrades multiply what you already have, which makes them almost always the better buy the moment you can afford one.<br><br><b>Open the Upgrades tab and buy one.</b>",
    at:()=>document.querySelector('.tab[data-tab="upgrades"]'), side:"left",
    when:()=>UPGRADES.some(u=>!S.upgrades[u.id] && u.need()),
    done:()=>Object.keys(S.upgrades).length >= 1
  },
  {
    k:"last step", h:"Then sell it all",
    b:"Cash and staff reset; reputation is permanent and makes every future run faster. Growing a business, selling it, and growing the next one quicker is the long game.<br><br><b>Open the Exit tab and sell when you are ready.</b>",
    at:()=>document.querySelector('.tab[data-tab="prestige"]'), side:"left",
    when:()=>pendingRep() > 0,
    done:()=>S.reputation > 0
  }
];

const coachEl = $("coach");
let coachTarget = null;

function tourStep(){
  if(S.tut.done) return -1;
  let i = S.tut.step || 0;
  // Skip past anything already satisfied -- a returning player should not
  // be told to do what they have plainly done.
  while(i < TOUR.length && TOUR[i].done()) i++;
  if(i !== (S.tut.step || 0)) S.tut.step = i;
  if(i >= TOUR.length){ S.tut.done = true; return -1; }
  return i;
}

function coachSync(){
  const i = tourStep();
  if(coachTarget){ coachTarget.classList.remove("coach-target"); coachTarget = null; }
  if(i < 0){ coachEl.classList.remove("on"); coachEl.setAttribute("aria-hidden","true"); return; }

  const s = TOUR[i];
  // A step can wait for the game to be ready for it (an upgrade to exist,
  // an exit to be worth taking) or for the right tab to be open.
  if((s.when && !s.when()) || (s.show && !s.show())){
    coachEl.classList.remove("on"); coachEl.setAttribute("aria-hidden","true"); return;
  }
  const at = s.at();
  if(!at){ coachEl.classList.remove("on"); return; }

  // A step's body may be a function, so it can count down what is left to
  // do. Rebuild when the step OR its wording changes -- not every tick.
  const body = typeof s.b === "function" ? s.b() : s.b;
  const key = i + "|" + body;
  if(coachEl.dataset.key !== key){
    coachEl.dataset.key = key;
    coachEl.dataset.step = String(i);
    coachEl.innerHTML =
      '<div class="co-arrow"></div>' +
      '<div class="co-k">' + s.k + '</div>' +
      '<div class="co-h">' + s.h + '</div>' +
      '<div class="co-b">' + body + '</div>' +
      '<div class="co-f"><button class="co-skip" id="coachSkip">Skip the tour</button>' +
      '<div class="co-dots">' + TOUR.map((_,n)=>'<div class="co-dot' + (n===i?" on":"") + '"></div>').join("") + '</div></div>';
    $("coachSkip").onclick = ()=>{ S.tut.done = true; coachSync(); save(); };
  }

  coachEl.classList.add("on");
  coachEl.setAttribute("aria-hidden","false");
  at.classList.add("coach-target");
  coachTarget = at;
  placeCoach(at, s.side);
}

const mobileQuery = matchMedia("(max-width:900px)");

function placeCoach(at, side){
  // On a phone there is no arrow -- the pulsing ring on the target does
  // the pointing -- so the panel just needs a spot that never collides
  // with the ticket above or the store below, however long its text
  // runs. Docked below the stats strip, height-capped with its own
  // scroll as a last resort rather than growing into either neighbor.
  if(mobileQuery.matches){
    const storeEl = document.querySelector(".store");
    const store = storeEl ? storeEl.getBoundingClientRect() : null;
    const stats = document.querySelector(".stats").getBoundingClientRect();
    const top = stats.bottom + 10;
    const maxH = store ? Math.max(56, store.top - 10 - top) : 200;
    coachEl.style.left = "";
    coachEl.style.top = Math.round(top) + "px";
    coachEl.style.bottom = "auto";
    coachEl.style.maxHeight = Math.round(maxH) + "px";
    return;
  }
  const r = at.getBoundingClientRect(), b = coachEl.getBoundingClientRect();
  const gap = 16;
  let x = side === "left" ? r.left - b.width - gap : r.right + gap;
  // Flip to the other side rather than hang off the edge.
  if(x < 8) x = r.right + gap;
  if(x + b.width > innerWidth - 8) x = r.left - b.width - gap;
  x = Math.max(8, Math.min(x, innerWidth - b.width - 8));
  let y = r.top + r.height/2 - b.height/2;
  y = Math.max(8, Math.min(y, innerHeight - b.height - 8));
  coachEl.style.left = Math.round(x) + "px";
  coachEl.style.top  = Math.round(y) + "px";

  const arrow = coachEl.querySelector(".co-arrow");
  if(arrow){
    const pointsLeft = x > r.left;
    arrow.style.top = Math.max(10, Math.min(r.top + r.height/2 - y - 5, b.height - 20)) + "px";
    arrow.style.left = pointsLeft ? "-6px" : "";
    arrow.style.right = pointsLeft ? "" : "-6px";
    arrow.style.transform = "rotate(" + (pointsLeft ? -45 : 135) + "deg)";
  }
}

addEventListener("resize", ()=>{ hideTip(); coachSync(); });

/* ---------- the one and only game loop ---------- */
let last = Date.now();
setInterval(()=>{
  const now = Date.now();
  // Clamp dt so a backgrounded tab that fires late cannot pay out a windfall.
  const dt = Math.min((now - last) / 1000, 1);
  last = now;
  earn(totalRate() * dt);
  renderHead();
  renderList();
  // Catches clicks/lifetime/staff crossing a threshold passively, on top
  // of the immediate checks after a hire, a purchase, or an exit.
  checkAchievements();
  // Cheap: it returns immediately once the tour is done, and only touches
  // the DOM when the step actually changes.
  coachSync();
  // The hovered row's numbers move with income, so refresh what it says.
  if(tipFor && document.contains(tipFor)) showTip(tipFor);
  else if(tipFor) hideTip();
}, TICK_MS);

setInterval(save, 20000);

load();
renderHead();
renderList();
coachSync();
// A save from before achievements existed may already qualify for several
// -- retroactively award them on load rather than making a returning
// player re-earn what they'd already done.
checkAchievements();

// Registration failing (unsupported browser, blocked, served over plain
// http) should never be a game-breaking error -- offline play and the
// install prompt are bonuses, not requirements.
if("serviceWorker" in navigator){
  addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
